name: build

on:
  workflow_dispatch:

jobs:
  build:
    # windows-2025 now serves the VS 2026 image (installed under ...\18\...),
    # which has no VS 2022 / v143 toolset. Pin to windows-2022 for VS 2022.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch libwebp v1.4.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Native\deps | Out-Null
          if (-not (Test-Path Native\deps\libwebp\src\webp\encode.h)) {
            Invoke-WebRequest -Uri "https://codeload.github.com/webmproject/libwebp/zip/refs/tags/v1.4.0" -OutFile libwebp.zip
            Expand-Archive -Path libwebp.zip -DestinationPath . -Force
            Move-Item -Path libwebp-1.4.0 -Destination Native\deps\libwebp -Force
          }

      - name: Fetch zxing-cpp v3.1.1
        shell: pwsh
        run: |
          if (-not (Test-Path Native\deps\zxing-cpp-311\core\src\ReadBarcode.h)) {
            Invoke-WebRequest -Uri "https://codeload.github.com/zxing-cpp/zxing-cpp/zip/refs/tags/v3.1.1" -OutFile zxing.zip
            Expand-Archive -Path zxing.zip -DestinationPath . -Force
            Move-Item -Path zxing-cpp-3.1.1 -Destination Native\deps\zxing-cpp-311 -Force
          }

      - name: Build ZXing static library
        shell: pwsh
        run: |
          $vsInstance = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsInstance)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstance = & $vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            }
          }
          if (-not $vsInstance -or -not (Test-Path $vsInstance)) {
            throw "Visual Studio 2022 with VC tools was not found."
          }
          $vsInstance = $vsInstance -replace '\\', '/'
          $env:VS170COMNTOOLS = "$vsInstance/Common7/Tools"
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:CMAKE_GENERATOR_INSTANCE = $vsInstance
          "Using Visual Studio instance: $vsInstance"
          $log = "Native/deps/zxing-cpp-311/cmake-zxing.log"
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          # ZXING_WRITERS defaults to ON and pulls in bundled libzint, whose
          # sources live in a git submodule that the codeload zip omits.
          # ScreenShut only decodes barcodes, so disable writers entirely.
          cmake -S Native/deps/zxing-cpp-311 -B Native/deps/zxing-cpp-311/build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_GENERATOR_INSTANCE=$vsInstance" -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DZXING_WRITERS=OFF -DZXING_EXAMPLES=OFF -DZXING_UNIT_TESTS=OFF -DZXING_BLACKBOX_TESTS=OFF 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "::error::CMake configure failed"
            Get-Content $log | Where-Object { $_ -match 'Error|error|CMake|failed|MSB|cl :|LINK' } | Select-Object -First 40 | ForEach-Object { "::error::$_" }
            exit $LASTEXITCODE
          }
          cmake --build Native/deps/zxing-cpp-311/build --config Release --target ZXing --parallel 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            "::error::CMake build failed"
            Get-Content $log | Where-Object { $_ -match 'Error|error|CMake|failed|MSB|cl :|LINK' } | Select-Object -First 40 | ForEach-Object { "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: Build ScreenShut
        shell: pwsh
        run: |
          msbuild Native/Src/ScreenShut.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      # lw.PPOCR.C 源码随仓库分发；CMake 用 runtime-only 模式（不需要 Python），
      # 本地打过补丁让共享库目标在该模式下仍然生成。模型转换单独在下一步完成。
      - name: Build OCR runtime (lw.PPOCR.C 1.2.2)
        shell: pwsh
        run: |
          cmake -S Native/deps/lw.PPOCR.C -B Native/deps/lw.PPOCR.C/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF -DLW_BUILD_HTTP_DEMO=OFF -DLW_BUILD_CSHARP_DEMOS=OFF -DLW_RUNTIME_ONLY=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Native/deps/lw.PPOCR.C/build --config Release --target lw_ppocr_c_shared --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'Native/deps/lw.PPOCR.C/build/Release/lw_ppocr_c.dll')) { throw 'lw_ppocr_c.dll not found' }

      # 把内置官方 ONNX 转成随程序分发的 LWM（只需 numpy + onnx，不用 onnxruntime）。
      - name: Convert OCR models to LWM
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 onnx==1.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location Native/deps/lw.PPOCR.C
          New-Item -ItemType Directory -Force -Path build/models | Out-Null
          python -m converter.convert_det --input models/ppocrv6-tiny/det.onnx --output build/models/det.lwm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m converter.convert_cls --input models/ppocrv6-tiny/cls.onnx --output build/models/cls.lwm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m converter.convert_rec --input models/ppocrv6-tiny/rec.onnx --output build/models/rec.lwm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Stage release package
        shell: pwsh
        run: |
          $pack = 'Native/x64/Release/pack'
          Remove-Item -Recurse -Force $pack -ErrorAction SilentlyContinue
          $runtime = Join-Path $pack 'AppData/config/plugin/ocr-runtime/ppocr-v6'
          $models  = Join-Path $pack 'AppData/config/plugin/ocr-models/ppocr-v6-tiny'
          New-Item -ItemType Directory -Force -Path $runtime, $models | Out-Null
          Copy-Item 'Native/x64/Release/ScreenShut.exe' $pack -Force
          Copy-Item 'Native/deps/lw.PPOCR.C/build/Release/lw_ppocr_c.dll' $runtime -Force
          Set-Content -LiteralPath (Join-Path $runtime 'runtime.id') -Value '1.2.2' -NoNewline -Encoding ascii
          foreach ($f in 'det.lwm','cls.lwm','rec.lwm') {
            Copy-Item "Native/deps/lw.PPOCR.C/build/models/$f" $models -Force
          }
          Copy-Item 'Native/deps/lw.PPOCR.C/models/ppocrv6-tiny/ppocr_keys.txt' $models -Force
          Set-Content -LiteralPath (Join-Path $models 'pack.id') -Value 'ppocrv6-tiny-1.2.2' -NoNewline -Encoding ascii
          Compress-Archive -Path (Join-Path $pack '*') -DestinationPath 'Native/x64/Release/ScreenShut.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShut
          path: Native/x64/Release/ScreenShut.zip
          if-no-files-found: error
          retention-days: 1
