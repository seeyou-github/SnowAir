name: build_fast_copy_ocr_stander

# 快速构建（带标准 OCR 模型）：lib 用 prebuilt-libs，AppData 整个打包，
# 但排除轻量模型目录 ocr-models/ppocr-v6-tiny（约 7M）。产物保留 1 天。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Use prebuilt static libs
        shell: pwsh
        run: ./.github/scripts/prepare-fast-build.ps1

      - name: Build ScreenShut
        shell: pwsh
        run: |
          msbuild Native/Src/ScreenShut.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release package
        shell: pwsh
        run: |
          $pack = 'Native/x64/Release/pack'
          Remove-Item -Recurse -Force $pack -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          Copy-Item 'Native/x64/Release/ScreenShut.exe' $pack -Force
          Copy-Item 'AppData' $pack -Recurse -Force

          # 排除 tiny 模型，只留标准
          $drop = Join-Path $pack 'AppData/Config/plugin/ocr-models/ppocr-v6-tiny'
          if (Test-Path $drop) { Remove-Item -Recurse -Force $drop }

          $keep = @(
            'AppData/Config/plugin/ocr-models/ppocr-v6',
            'AppData/Config/plugin/ocr-runtime/ppocr-v6'
          )
          foreach ($k in $keep) {
            if (-not (Test-Path (Join-Path $pack $k))) { throw "expected in package: $k" }
          }
          Write-Host "--- package tree ---"
          Get-ChildItem $pack -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $pack).Path.Length + 1) }

          Compress-Archive -Path (Join-Path $pack '*') -DestinationPath 'Native/x64/Release/ScreenShut-fast-ocr-standard.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShut-fast-ocr-standard
          path: Native/x64/Release/ScreenShut-fast-ocr-standard.zip
          if-no-files-found: error
          retention-days: 1
